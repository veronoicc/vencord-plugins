name: Trigger arch-repo build

on:
  push:
    branches: [main]

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger vero-on-arch
        run: |
          gh api repos/veronoicc/vero-on-arch/dispatches -f event_type=upstream_update
        env:
          GH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
